<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">
  <!-- Tomato Brother Player Sprite - 16x16 pixel art -->
  <!-- Body (red tomato) -->
  <rect x="4" y="6" width="8" height="8" fill="#FF6347"/>
  <rect x="3" y="7" width="10" height="6" fill="#FF6347"/>
  <rect x="2" y="8" width="12" height="4" fill="#FF6347"/>
  
  <!-- Eyes -->
  <rect x="5" y="8" width="2" height="2" fill="#FFFFFF"/>
  <rect x="9" y="8" width="2" height="2" fill="#FFFFFF"/>
  <rect x="6" y="9" width="1" height="1" fill="#000000"/>
  <rect x="10" y="9" width="1" height="1" fill="#000000"/>
  
  <!-- Smile -->
  <rect x="6" y="11" width="4" height="1" fill="#000000"/>
  
  <!-- Green stem on top -->
  <rect x="7" y="3" width="2" height="3" fill="#228B22"/>
  <rect x="5" y="4" width="6" height="2" fill="#228B22"/>
  
  <!-- Highlight -->
  <rect x="4" y="7" width="2" height="2" fill="#FFB6C1"/>
</svg>
