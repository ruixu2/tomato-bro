<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">
  <!-- Enemy Sprite - 16x16 pixel art (Purple alien creature) -->
  <!-- Body -->
  <rect x="4" y="5" width="8" height="9" fill="#8B008B"/>
  <rect x="3" y="6" width="10" height="7" fill="#8B008B"/>
  <rect x="2" y="7" width="12" height="5" fill="#8B008B"/>
  
  <!-- Eyes (angry) -->
  <rect x="4" y="7" width="3" height="2" fill="#FFFF00"/>
  <rect x="9" y="7" width="3" height="2" fill="#FFFF00"/>
  <rect x="5" y="8" width="1" height="1" fill="#000000"/>
  <rect x="10" y="8" width="1" height="1" fill="#000000"/>
  
  <!-- Eyebrows (angry) -->
  <rect x="4" y="6" width="3" height="1" fill="#4B004B"/>
  <rect x="9" y="6" width="3" height="1" fill="#4B004B"/>
  
  <!-- Mouth (frown) -->
  <rect x="6" y="11" width="4" height="1" fill="#4B004B"/>
  
  <!-- Antennae -->
  <rect x="5" y="3" width="1" height="2" fill="#8B008B"/>
  <rect x="10" y="3" width="1" height="2" fill="#8B008B"/>
  <rect x="4" y="2" width="2" height="1" fill="#FF69B4"/>
  <rect x="10" y="2" width="2" height="1" fill="#FF69B4"/>
</svg>
